[package]
name = "drawthing"
version = "0.1.0"
description = "DrawThing desktop app"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# The `_lib` suffix keeps the library apart from the binary on Windows (cargo#8519).
name = "drawthing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# canonicalize() without Windows' \\?\ prefix, so paths compare and display normally.
dunce = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
