# Publishes the deployable image (Dockerfile target "runtime") to GitHub Packages:
#   ghcr.io/alexmealey/draw-thing:latest        every push to main
#   ghcr.io/alexmealey/draw-thing:1.2.0         a pushed tag v1.2.0 (also 1.2)
#   ghcr.io/alexmealey/draw-thing:sha-<commit>  every build
# For Intel/AMD and ARM (Raspberry Pi, Apple Silicon). See README.md, "Published image".
name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alexmealey/draw-thing
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Plain multi-platform index: GHCR refused an image index carrying attestations.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
