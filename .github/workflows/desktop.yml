# Builds the experimental desktop app (src-tauri/) for Windows, macOS and Linux and keeps the
# results as workflow artifacts (Actions → this run → Artifacts). Nothing is released or signed:
# Windows SmartScreen and macOS Gatekeeper will warn the first time it's opened.
#
#   windows   DrawThing_<v>_x64-setup.exe (installer) and drawthing.exe (portable; needs the
#             WebView2 runtime, which Windows 10 and 11 already have)
#   macos     DrawThing_<v>_universal.dmg (Apple Silicon and Intel)
#   linux     .AppImage and .deb
name: Desktop app

on:
  push:
    branches: [experimental/tauri]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
            bundles: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/drawthing.exe
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
            bundles: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux
            os: ubuntu-22.04
            args: ''
            bundles: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # The web checks are the same everywhere; once is enough.
      - name: Web checks
        if: matrix.name == 'linux'
        run: npm run check

      # On every OS: the library code is all file paths, renames and locking.
      - name: Rust tests
        shell: bash
        working-directory: src-tauri
        run: |
          mkdir -p ../dist-desktop
          cargo clippy --all-targets -- -D warnings
          cargo test

      - uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: drawthing-desktop-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
